<style>
:root {
  color-scheme: light;
  --crema: #FFF6E5; --papel: #FFFDF8; --tinta: #1E2235; --gris: #686C7E; --linea: #EBDFC8;
  --coral: #FF5647; --coral-s: #FFE0DB; --teal: #089C9C; --teal-s: #D2F1EE; --mostaza: #E99B00; --mostaza-s: #FFEBBD;
  --violeta: #6741E0; --violeta-s: #E7DFFF; --verde: #17A262; --verde-s: #D4F2E1;
  --tit: 'Fraunces', 'Iowan Old Style', Georgia, serif; --txt: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 18px; --sombra: 0 1px 0 rgba(30, 34, 53, .04), 0 10px 28px -14px rgba(30, 34, 53, .28);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--crema); color: var(--tinta); font: 16px/1.55 var(--txt); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--tit); font-weight: 600; line-height: 1.12; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 1.45rem; margin: 0 0 .5rem; }

code { font: 600 .86rem/1.4 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
small { display: block; color: var(--gris); font-size: .8rem; margin-top: .15rem; }

/* marco */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: rgba(255, 246, 229, .93); backdrop-filter: blur(10px); border-bottom: 1px solid var(--linea); }
.logo { display: flex; align-items: baseline; gap: 8px; text-decoration: none; }
.logo b { font: 700 1.25rem var(--tit); background: var(--tinta); color: var(--crema); padding: 2px 9px 3px; border-radius: 9px; letter-spacing: .04em; }
.logo span { font: 600 .92rem var(--tit); }
.xlsel { font-size: .74rem; color: var(--gris); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.xlsel select { font: 600 .78rem var(--txt); border: 1px solid var(--linea); background: var(--papel); border-radius: 9px; padding: 5px 6px; color: var(--tinta); max-width: 128px; }
.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: flex; background: var(--papel); border-top: 1px solid var(--linea); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); }
.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px; text-decoration: none; font-size: .66rem; font-weight: 600; color: var(--gris); border-radius: 12px; }
.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs a.on { color: var(--coral); background: var(--coral-s); }
.pag { max-width: 900px; margin: 0 auto; padding: 18px 16px 110px; }
.pag > section, .lec > section { margin-top: 30px; }
.tit { font-size: clamp(1.8rem, 6vw, 2.6rem); margin: 4px 0 8px; }
.sub { color: var(--gris); font-size: .95rem; }
.volver { display: inline-block; font-size: .84rem; font-weight: 600; color: var(--gris); text-decoration: none; margin-bottom: 6px; }
.lk { font-weight: 700; color: var(--coral); text-decoration: none; font-size: .9rem; }

/* botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; cursor: pointer; text-decoration: none; font: 700 .93rem var(--txt); padding: 11px 16px; border-radius: 13px; color: var(--tinta); background: transparent; transition: transform .08s; text-align: center; }
.btn:active { transform: scale(.97); }
.btn.pri { background: var(--tinta); color: #fff; }
.btn.bl { background: var(--papel); box-shadow: inset 0 0 0 1.5px var(--tinta); }
.btn.lin { padding: 8px 4px; color: var(--gris); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.btn.gr { padding: 14px 18px; font-size: 1rem; }
.btn.mini { font-size: .78rem; padding: 7px 11px; background: var(--tinta); color: #fff; border-radius: 10px; }
.btn.ok { background: var(--verde); }
.acc { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }

/* inicio */
.hero { display: grid; grid-template-columns: 1fr; gap: 18px; background: linear-gradient(135deg, #FF5647 0%, #FF8A3D 55%, #F6B21B 100%); color: #fff; border-radius: 26px; padding: 26px 22px; position: relative; overflow: hidden; box-shadow: var(--sombra); }
.hero::after { content: '%'; position: absolute; right: -18px; bottom: -70px; font: 700 15rem var(--tit); opacity: .13; line-height: 1; }
.kicker { font-weight: 700; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; opacity: .92; }
.hero h1 { font-size: clamp(2.7rem, 12vw, 4.4rem); line-height: .96; margin-bottom: 14px; }
.cuenta { font-size: 1.08rem; background: rgba(30, 34, 53, .2); display: inline-block; padding: 9px 14px; border-radius: 14px; }
.cuenta span { display: block; font-size: .8rem; opacity: .9; }
.hero-b { display: flex; flex-wrap: wrap; gap: 10px; position: relative; z-index: 1; }
.hero .btn.bl { background: rgba(255, 255, 255, .95); box-shadow: none; }
.anillo { position: relative; width: 132px; height: 132px; z-index: 1; }
.anillo svg { transform: rotate(-90deg); }
.anillo circle { fill: none; stroke-width: 11; stroke-linecap: round; }
.a0 { stroke: rgba(255, 255, 255, .28); } .a1 { stroke: #fff; transition: stroke-dashoffset .6s; }
.anillo div { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.anillo b { font: 700 2.1rem var(--tit); line-height: 1; } .anillo span { font-size: .62rem; font-weight: 600; line-height: 1.2; opacity: .95; }
.plan { display: grid; gap: 10px; }
.pl { display: flex; gap: 14px; background: var(--papel); border-radius: var(--r); padding: 15px; box-shadow: var(--sombra); }
.pl h3 { font-size: 1.12rem; } .pl p { font-size: .88rem; color: var(--gris); margin: 2px 0 8px; }
.chk { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--tinta); background: transparent; font: 700 1rem var(--tit); cursor: pointer; color: var(--tinta); }
.pl.on .chk { background: var(--verde); border-color: var(--verde); color: #fff; }
.pl.on { opacity: .82; }
.minis { display: flex; flex-wrap: wrap; gap: 6px; }
.minis a { font-size: .76rem; font-weight: 600; text-decoration: none; padding: 4px 9px; border-radius: 99px; background: var(--crema); border: 1px solid var(--linea); }
.minis a.ok { background: var(--verde-s); border-color: transparent; color: #0b6b3f; }
.cnt { margin: 8px 0 0 !important; font-size: .76rem !important; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.tile { display: block; text-decoration: none; border-radius: var(--r); padding: 17px; min-height: 128px; box-shadow: var(--sombra); transition: transform .12s; }
.tile:hover { transform: translateY(-3px); }
.tile h3 { font-size: 1.15rem; margin-bottom: 6px; } .tile p { font-size: .86rem; margin: 0; opacity: .88; }
.tile.coral { background: var(--coral); color: #fff; } .tile.teal { background: var(--teal); color: #fff; } .tile.mostaza { background: #F8B62B; } .tile.verde { background: var(--verde); color: #fff; } .tile.violeta { background: var(--violeta); color: #fff; } .tile.tinta { background: var(--tinta); color: #fff; }
.como ol { padding-left: 1.2rem; margin: 0 0 .8rem; } .como li { margin-bottom: .45rem; }
.notas { font-size: .8rem; color: var(--gris); }

/* ruta */
.uni { background: var(--papel); border-radius: 22px; overflow: hidden; box-shadow: var(--sombra); }
.uni header { display: flex; gap: 14px; align-items: center; padding: 16px 18px; color: #fff; }
.uni header h2 { margin: 0; font-size: 1.3rem; } .uni header p { margin: 2px 0 0; font-size: .84rem; opacity: .92; }
.un { flex: none; width: 42px; height: 42px; border-radius: 13px; background: rgba(255, 255, 255, .24); display: grid; place-items: center; font: 700 1.4rem var(--tit); }
.uni.coral header { background: var(--coral); } .uni.teal header { background: var(--teal); } .uni.mostaza header { background: #F0A91A; color: var(--tinta); } .uni.verde header { background: var(--verde); } .uni.violeta header { background: var(--violeta); }

.lt { flex: 1; font-weight: 600; } .lm { font-size: .74rem; color: var(--gris); white-space: nowrap; }
.stars { white-space: nowrap; letter-spacing: 1px; } .st { font-style: normal; color: #DDD1B8; font-size: 1rem; } .st.on { color: var(--mostaza); }

/* lección */
.meta { color: var(--gris); font-size: .86rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.lec .tit { text-wrap: balance; }
.blo > p { max-width: 66ch; }
.blo h2 { display: flex; align-items: center; gap: 10px; }
.blo h2::before { content: ''; width: 12px; height: 12px; border-radius: 4px; background: var(--coral); flex: none; }
.lec.teal .blo h2::before { background: var(--teal); } .lec.mostaza .blo h2::before { background: var(--mostaza); } .lec.verde .blo h2::before { background: var(--verde); } .lec.violeta .blo h2::before { background: var(--violeta); }
.fors { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.for { background: var(--papel); border-radius: 15px; padding: 13px 15px; border: 1px solid var(--linea); display: flex; flex-direction: column; gap: 5px; }
.for span { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--gris); }
.for p { font: 500 1.05rem/1.45 var(--tit); margin: 0; }
.for code { align-self: flex-start; background: var(--verde-s); color: #0a5c36; padding: 3px 8px; border-radius: 7px; overflow-wrap: anywhere; }
.for a { font-size: .74rem; color: var(--gris); margin-top: auto; }
.uni.fo { background: transparent; box-shadow: none; overflow: visible; } .uni.fo header { border-radius: 18px; margin-bottom: 10px; padding: 11px 16px; }
.origen { font-size: .78rem; font-weight: 700; color: var(--gris); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
.ojo { background: var(--mostaza-s); border-radius: var(--r); padding: 16px 18px; }
.ojo ul { margin: 0; padding-left: 1.1rem; } .ojo li { margin-bottom: .4rem; }
.pn { display: flex; justify-content: space-between; gap: 10px; margin-top: 34px; flex-wrap: wrap; } .pn .btn { flex: 1 1 220px; }

/* ejercicio */
.ej { background: var(--papel); border-radius: 20px; padding: 18px; box-shadow: var(--sombra); border: 2px solid transparent; }
.ej.ok { border-color: var(--verde); }
.enun { font-size: 1.04rem; line-height: 1.6; }
.eti { display: inline-block; font-size: .72rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; margin: 14px 0 6px; background: var(--coral-s); }
.eti.teal { background: var(--teal-s); } .eti.mostaza { background: var(--mostaza-s); } .eti.verde { background: var(--verde-s); } .eti.violeta { background: var(--violeta-s); }
.diag { width: 100%; height: auto; display: block; margin: 6px 0 0; }
.diag .eje, .graf .eje { stroke: var(--tinta); stroke-width: 1.6; }
.fl { stroke-width: 2.2; } .fl.in { stroke: var(--teal); } .fl.out { stroke: var(--coral); } .fl.gr { stroke-width: 3.2; }
.nodo { fill: var(--papel); stroke: var(--tinta); stroke-width: 1.4; }
.dn { font: 700 10px var(--txt); text-anchor: middle; fill: var(--tinta); }
.dt { font: 600 12.5px var(--txt); text-anchor: middle; fill: var(--gris); } .dt.in { fill: #067575; } .dt.out { fill: #D43A2C; } .dt.b { font-weight: 700; font-size: 13.5px; } .dt.tr { fill: var(--tinta); font-size: 12px; }
.diag-ley { font-size: .74rem; color: var(--gris); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 2px 0 10px; }
.p { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-left: 8px; } .p.in { background: var(--teal); } .p.out { background: var(--coral); } .p.vi { background: var(--violeta); }
.resp-fija { background: var(--verde-s); border-radius: 12px; padding: 10px 14px; margin: 8px 0; }
.resp { display: flex; gap: 10px; margin-top: 10px; }
.resp label { flex: 1; display: flex; align-items: center; background: #fff; border: 2px solid var(--tinta); border-radius: 13px; padding: 0 12px; min-width: 0; }
.resp input { flex: 1; min-width: 0; border: 0; outline: 0; font: 700 1.15rem var(--txt); padding: 11px 6px; background: transparent; color: var(--tinta); }
.pre, .suf { font-weight: 700; color: var(--gris); }
.ayuda { font-size: .76rem; color: var(--gris); margin: 6px 0 0; }
.fb { margin-top: 10px; }
.caja { border-radius: 14px; padding: 12px 15px; font-size: .95rem; }
.caja.bien { background: var(--verde-s); } .caja.mal { background: var(--coral-s); } .caja.neu { background: var(--violeta-s); }
.caja .pasos { margin-top: 8px; }
details.sol { margin-top: 10px; } details.sol > summary, details.av > summary { cursor: pointer; font-weight: 700; padding: 8px 0; color: var(--tinta); }
.pasos { margin: 8px 0 14px; padding-left: 1.25rem; } .pasos li { margin-bottom: .55rem; overflow-wrap: anywhere; }
.chip { display: inline-block; font: 700 .74rem ui-monospace, Menlo, monospace; background: var(--tinta); color: #fff; padding: 2px 7px; border-radius: 6px; } .chip.gr { font-size: .95rem; padding: 4px 10px; background: var(--teal); }
.ops { display: grid; gap: 8px; margin-top: 6px; }
.op { text-align: left; font: 600 .98rem var(--txt); padding: 13px 15px; border-radius: 13px; border: 2px solid var(--linea); background: #fff; cursor: pointer; color: var(--tinta); }
.op.ok { border-color: var(--verde); background: var(--verde-s); } .op.mal { border-color: var(--coral); background: var(--coral-s); }

/* excel */
.xl { margin-top: 12px; border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; background: #fff; }
.xl-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; background: #1D6F42; color: #fff; }
.xl-tit { font-weight: 700; font-size: .84rem; } .xl-top .btn.mini { background: #fff; color: #1D6F42; } .xl-top .btn.mini.ok { background: var(--mostaza); color: var(--tinta); }
.xl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; } .xl-scroll.alto { max-height: 430px; overflow-y: auto; }
.xl table { border-collapse: collapse; font: 500 .78rem/1.3 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; width: 100%; }

.xl td.rot { font-family: var(--txt); font-weight: 600; } .xl td.num { text-align: left; } .xl td.fx { color: #1D6F42; font-weight: 700; } .xl td.res { background: #FFF1B8; box-shadow: inset 0 0 0 2px var(--mostaza); }
.xl tr.salto td { text-align: center; color: var(--gris); font-family: var(--txt); background: #FAFAF7; }
.xl-nota { font-size: .76rem; color: var(--gris); padding: 8px 11px; margin: 0; background: #FAFAF7; }
table.amort td { text-align: right; } table.amort td:first-child { text-align: center; font-weight: 700; }
table.fun td { text-align: left; white-space: normal; font-family: var(--txt); } table.fun td:first-child { text-align: left; }

/* práctica */
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 8px 0; align-items: center; }
.chipb { font-size: .8rem; font-weight: 600; text-decoration: none; padding: 7px 12px; border-radius: 99px; background: var(--papel); border: 1.5px solid var(--linea); }
.chipb.on { background: var(--tinta); color: #fff; border-color: var(--tinta); }
.cu { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font: 700 .85rem var(--tit); color: #fff; background: var(--coral); }
.chips.teal .cu { background: var(--teal); } .chips.mostaza .cu { background: var(--mostaza); } .chips.verde .cu { background: var(--verde); } .chips.violeta .cu { background: var(--violeta); }
.zona-p { margin-top: 18px; scroll-margin-top: 70px; } #zona { scroll-margin-top: 70px; }
.sim-top { display: flex; justify-content: space-between; align-items: center; position: sticky; top: 52px; background: var(--crema); z-index: 5; padding: 4px 0; }
.reloj { font: 700 1.3rem ui-monospace, Menlo, monospace; background: var(--tinta); color: #fff; padding: 6px 13px; border-radius: 12px; } .reloj.poco { background: var(--coral); }
.nota { margin-top: 18px; background: var(--tinta); color: #fff; border-radius: 22px; padding: 24px; text-align: center; } .nota b { display: block; font: 700 2.8rem var(--tit); } .nota span { opacity: .85; }
.hist { padding-left: 1.1rem; }

/* herramientas */
.tool { display: grid; gap: 18px; margin-top: 14px; }
.form { background: var(--papel); border-radius: 20px; padding: 16px; box-shadow: var(--sombra); display: grid; gap: 10px; align-content: start; }
.cp { display: grid; gap: 4px; } .cp > span { font-size: .74rem; font-weight: 700; color: var(--gris); text-transform: uppercase; letter-spacing: .04em; }
.cp input, .cp select { width: 100%; font: 600 1rem var(--txt); padding: 10px 12px; border-radius: 11px; border: 1.5px solid var(--linea); background: #fff; color: var(--tinta); }
.cp input:focus, .cp select:focus { outline: 0; border-color: var(--tinta); }
.cp.inc input { background: var(--mostaza-s); border-style: dashed; color: transparent; } .cp.inc > span::after { content: ' · es lo que se calcula'; text-transform: none; color: var(--mostaza); }
input[type=range] { width: 100%; accent-color: var(--coral); margin: -2px 0 4px; }
details.av { border-top: 1px solid var(--linea); padding-top: 2px; } details.av[open] { display: grid; gap: 10px; }
.kpi { background: var(--papel); border-radius: 15px; padding: 12px 14px; border: 1px solid var(--linea); min-width: 0; }
.kpi span { display: block; font-size: .72rem; font-weight: 700; color: var(--gris); text-transform: uppercase; letter-spacing: .04em; } .kpi b { font: 700 1.2rem var(--tit); overflow-wrap: anywhere; }
.kpi.gr { border: 0; color: #fff; padding: 18px; box-shadow: var(--sombra); } .kpi.gr span { color: rgba(255, 255, 255, .9); } .kpi.gr b { font-size: clamp(1.7rem, 7vw, 2.5rem); }
.kpi.coral { background: var(--coral); } .kpi.teal { background: var(--teal); } .kpi.mostaza { background: #F0A91A; color: var(--tinta); } .kpi.mostaza span { color: rgba(30, 34, 53, .75); } .kpi.verde { background: var(--verde); } .kpi.violeta { background: var(--violeta); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 8px 0; }
.out { min-width: 0; }
.fxb { background: #1D6F42; color: #fff; border-radius: 13px; padding: 10px 14px; margin: 8px 0; } .fxb span { display: block; font-size: .7rem; font-weight: 700; opacity: .85; text-transform: uppercase; } .fxb code { font-size: .95rem; overflow-wrap: anywhere; }
.lados { display: grid; gap: 10px; } .lado { background: var(--papel); border-radius: 20px; padding: 16px; box-shadow: var(--sombra); display: grid; gap: 10px; align-content: start; } .lado h3 { font-size: 1.2rem; }
.flechota { text-align: center; font: 700 1.8rem var(--tit); color: var(--teal); transform: rotate(90deg); }
.ck { display: flex; align-items: center; gap: 8px; font-weight: 600; } .ck input { width: 20px; height: 20px; accent-color: var(--teal); }
.sig { margin: 0; font-size: .88rem; }
.ruta-t { width: 100%; border-collapse: collapse; margin: 12px 0; background: var(--papel); border-radius: 15px; overflow: hidden; box-shadow: var(--sombra); }

  // =============== TASAS ===============
  function tasaTxt(t) { return '<b>' + pc(t.v) + ' ' + MF.sigla(t) + '</b> (' + MF.nombreTasa(t).toLowerCase() + ')'; }
  function pasosConv(o, d, c) {
    var out = ['Sigla de partida: <b>' + MF.sigla(o) + '</b>. Sigla de llegada: <b>' + MF.sigla(d) + '</b>. Se camina paso a paso, cambiando una sola cosa cada vez.'];
    c.pasos.forEach(function (s) { out.push('<span class="chip">' + s.sigla + '</span> ' + s.op + ' = <b>' + pc(s.v, 4) + '</b><br><small>' + s.nota + '</small>'); });
    return out;
  }
  function xlConv(o, c) {
    var filas = [[MF.sigla(o), P_(o.v)]];
    c.pasos.forEach(function (s, k) {
      var prev = 'B' + (k + 1), f;
      if (s.op.indexOf('LN') === 0) f = '=LN(1+' + prev + ')';
      else if (s.op.indexOf('e^') === 0) f = '=EXP(' + prev + '*' + s.op.replace(/^e\^\(r × /, '').replace(/\) − 1$/, '').replace(',', '.') + ')-1';
      else if (s.op.indexOf('÷ (1 −') > 0) f = '=' + prev + '/(1-' + prev + ')';
      else if (s.op.indexOf('÷ (1 +') > 0) f = '=' + prev + '/(1+' + prev + ')';
      else if (s.op.indexOf('^') > 0) f = '=(1+' + prev + ')^' + s.op.replace(/^\(1 \+ i\)\^/, '').replace(/ − 1$/, '').replace(',', '.') + '-1';
      else if (s.op.indexOf('÷') === 0) f = '=' + prev + '/' + s.op.slice(2).replace(',', '.');
      else f = '=' + prev + '*' + s.op.slice(2).replace(',', '.');
      filas.push([s.sigla, f]);
    });
    return xl(filas, 'Una fila por paso, con la sigla al lado. Así lo hace el profesor en la hoja «Tasas».');
  }
  G.conv = function (p) {
    if (!p) {
      var fam = ri(1, 6), pers = ['M', 'T', 'S', 'A'], o, d;
      var dos = function () { var a = pick(pers), b = pick(pers); while (b === a) b = pick(pers); return [a, b]; };
      var x = dos(), y = dos();
      if (fam === 1) { o = { per: x[0], cap: x[0] }; d = { per: x[1], cap: x[1] }; }
      else if (fam === 2) { o = { per: x[0], cap: x[1] }; d = { per: y[0], cap: y[0] }; }
      else if (fam === 3) { o = { per: x[0], cap: x[0] }; d = { per: y[0], cap: y[1] }; }
      else if (fam === 4) { o = { per: x[0], cap: x[1] }; d = { per: y[0], cap: y[1] }; }
      else if (fam === 5) { o = { per: x[0], cap: x[1], ant: true }; d = { per: y[0], cap: y[0] }; }
      else { o = { per: x[0], cap: x[1], ant: Math.random() < 0.5 }; d = { per: y[0], cap: y[1], ant: true }; }
      var base = rs(0.08, 0.3, 0.01);
      o.v = Math.round(base * MF.PER[o.per] / 12 * 10000) / 10000;
      if (o.v < 0.005) o.v = 0.01;
      p = { o: o, d: d };
    }
    var c = MF.convertir(p.o, p.d);
    return {
      tema: 'conv', tipo: '%', resp: c.v * 100,
      enun: 'Convierta una tasa del ' + tasaTxt(p.o) + ' a una tasa <b>' + MF.sigla(p.d) + '</b> (' + MF.nombreTasa(p.d).toLowerCase() + ').',
      pasos: pasosConv(p.o, p.d, c), excel: xlConv(p.o, c)
    };
  };

  G.continua = function (p) {

    if (p.o.cont && !p.d.cont && Math.random() < 0.5 && !p.fijo) p.d = { per: p.o.per, cap: p.o.per };
    var c = MF.convertir(p.o, p.d);
    return {

      pasos: pasosConv(p.o, p.d, c), excel: xlConv(p.o, c)
    };

  G.realEncadenada = function (p) {
    p = p || { t: [{ v: rs(0.06, 0.12, 0.0025), per: 'A', cap: 'A' }, { v: rs(0.03, 0.06, 0.0025), per: 'S', cap: 'T' }, { v: rs(0.02, 0.045, 0.0025), per: 'T', cap: 'M', ant: Math.random() < 0.5 }], inf: [rs(0.03, 0.06, 0.0025), rs(0.03, 0.06, 0.0025), rs(0.03, 0.06, 0.0025)] };

        'Si pidieran el promedio anual: (1 + ' + pc(real) + ')' + sup('1/3') + ' − 1 = ' + pc(pow(1 + real, 1 / 3) - 1) + ' E.A.'],
      excel: xl([['Año 1 (E.A.)', P_(ea[0])], ['Año 2 (E.A.)', P_(ea[1])], ['Año 3 (E.A.)', P_(ea[2])], ['Inflación 1', P_(p.inf[0])], ['Inflación 2', P_(p.inf[1])], ['Inflación 3', P_(p.inf[2])], ['Nominal 3 años', '=(1+B1)*(1+B2)*(1+B3)-1'], ['Inflación 3 años', '=(1+B4)*(1+B5)*(1+B6)-1'], ['Real 3 años', '=(1+B7)/(1+B8)-1']], 'Antes hay que convertir cada tasa a E.A. con el conversor. Es el punto 1 del Repaso Parcial 2.')
    };
  };

  G.rendGeo = function (p) {

    var acum = p.r.reduce(function (a, x) { return a * (1 + x); }, 1), n = p.r.length, geo = pow(acum, 1 / n) - 1, ari = p.r.reduce(function (a, x) { return a + x; }, 0) / n;

  // =============== AMORTIZACIÓN ===============
  function tablaXL(P, i, n, sig) {
    var c = [['A1', 'Préstamo'], ['B1', P], ['A2', 'Interés'], ['B2', P_(i)], ['C2', sig], ['A3', 'Periodos'], ['B3', n], ['A4', 'Cuota'], ['B4', '=PMT(B2,B3,-B1)'],
      ['B7', 'Periodo'], ['C7', 'Saldo inicial'], ['D7', 'Intereses'], ['E7', 'Saldo inicial + intereses'], ['F7', 'Cuota'], ['G7', 'Abono a capital'], ['H7', 'Saldo final'], ['B8', 0], ['H8', '=B1']];
    for (var k = 1; k <= n; k++) {
      var r = 8 + k;
      c.push(['B' + r, k], ['C' + r, '=H' + (r - 1)], ['D' + r, '=C' + r + '*$B$2'], ['E' + r, '=C' + r + '+D' + r], ['F' + r, '=$B$4'], ['G' + r, '=F' + r + '-D' + r], ['H' + r, '=E' + r + '-F' + r]);
    }
    return { celdas: c, res: 'B4', nota: 'Es la misma estructura de la hoja «1. Pago final de periodo» del Tema 3. Al pegarla queda la tabla completa con sus fórmulas.' };
  }

  G.tablaFila = function (p) {

  function pasosTenedor(r, quien) {
    var out = [];
    if (r.iMesCompra != null) out.push('Precio de compra = VP de los flujos que faltan, a la tasa de mercado mensual (' + pc(r.iMesCompra, 4) + ') = ' + fm(r.precioCompra));
    if (r.precioVenta != null) out.push('Precio de venta = VP de los flujos que faltan ese día, a la tasa de mercado mensual (' + pc(r.iMesVenta, 4) + ') = ' + fm(r.precioVenta));
    if (r.comCompra) out.push('Al comprar: comisión = precio × % = ' + fm(r.comCompra) + ' e IVA sobre la comisión = ' + fm(r.ivaCompra) + '. Se suman a lo que paga.');
    if (r.comVenta) out.push('Al vender: comisión = ' + fm(r.comVenta) + ' e IVA = ' + fm(r.ivaVenta) + '. Se restan de lo que recibe.');
    out.push('Cupón bruto ' + fm(r.cupon) + '; después de retención, cupón neto ' + fm(r.cuponNeto) + '.');
    out.push('Flujo de caja mes a mes: ' + r.filas.filter(function (f) { return Math.abs(f.fc) > 0.5; }).map(function (f) { return 'mes ' + f.t + ': ' + nf(f.fc); }).join(' · '));
    out.push('TIR del flujo = ' + pc(r.tirMes, 4) + ' mensual → (1 + TIR)' + sup('12') + ' − 1 = <b>' + pc(r.ea) + ' E.A.</b>');
    return out;
  }
  function xlTenedor(r) {
    var c = [['A1', 'Mes'], ['B1', 'Precio'], ['C1', 'Cupones'], ['D1', 'Retenciones'], ['E1', 'Comisión'], ['F1', 'IVA'], ['G1', 'FC']];
    r.filas.forEach(function (f, k) {
      var row = k + 2;
      c.push(['A' + row, f.t], ['B' + row, Math.round(f.precio * 100) / 100], ['C' + row, Math.round(f.cupon * 100) / 100], ['D' + row, Math.round(f.retencion * 100) / 100], ['E' + row, Math.round(f.comision * 100) / 100], ['F' + row, Math.round(f.iva * 100) / 100], ['G' + row, '=SUM(B' + row + ':F' + row + ')']);
